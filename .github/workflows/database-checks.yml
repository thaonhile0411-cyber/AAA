name: Database checks

on:
  push:
    branches: [database]
    paths:
      - "supabase/**"
      - ".github/workflows/database-checks.yml"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/database-checks.yml"

permissions:
  contents: read

jobs:
  verify-database:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply migrations and seed
        run: supabase start

      - name: Run database lint
        run: supabase db lint --level warning

      - name: Verify schema and seed counts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from pg_tables where schemaname = 'public' and tablename in ('profiles','learning_goals','placement_questions','placement_question_keys','placement_attempts','placement_answers','learning_materials','roadmaps','roadmap_milestones','roadmap_activities','practice_exercises','practice_questions','practice_exercise_grading','practice_answer_keys','practice_attempts','practice_completion_events');")" = "16"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from public.placement_questions;")" = "6"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from public.placement_question_keys;")" = "6"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from public.learning_materials;")" = "8"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from pg_policies where schemaname = 'public';")" = "46"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from public.practice_exercises;")" = "8"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from public.practice_questions;")" = "40"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from public.practice_answer_keys;")" = "40"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from public.practice_exercise_grading where transcript is not null;")" = "4"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from public.practice_exercises where source_attribution = 'VOA Learning English';")" = "8"

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
