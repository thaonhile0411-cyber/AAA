name: IELTS App CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint, TypeScript and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download source code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code with ESLint
        run: npm run lint

      - name: Check TypeScript
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Build application
        run: npm run build
        